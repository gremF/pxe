name: Image Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force rebuild even if version matches"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-version:
    name: Check iVentoy Version
    runs-on: ubuntu-latest
    outputs:
      iventoy_version: ${{ steps.get-version.outputs.version }}
      should_build: ${{ steps.check-build.outputs.should_build }}

    steps:
      - name: Get latest iVentoy version
        id: get-version
        run: |
          VERSION=$(curl -s https://api.github.com/repos/ventoy/PXE/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Latest iVentoy version: ${VERSION}"

      - name: Check if build is needed
        id: check-build
        env:
          FORCE_BUILD: ${{ github.event.inputs.force_build }}
        run: |
          REPO="gremf/pxe"
          TOKEN=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${REPO}:pull" | jq -r '.token')

          MANIFEST=$(curl -s -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://registry-1.docker.io/v2/${REPO}/manifests/latest")

          if [ -z "$MANIFEST" ] || echo "$MANIFEST" | grep -q '"errors"'; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Build needed: No existing image found"
            exit 0
          fi

          DIGEST=$(echo "$MANIFEST" | jq -r '.config.digest')

          CONFIG=$(curl -s -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://registry-1.docker.io/v2/${REPO}/blobs/${DIGEST}")

          CURRENT_VERSION=$(echo "$CONFIG" | jq -r '.config.Labels.IVENTOY // empty')

          echo "Current Docker image version: ${CURRENT_VERSION:-none}"
          echo "Latest iVentoy version: ${{ steps.get-version.outputs.version }}"

          if [ "$CURRENT_VERSION" != "${{ steps.get-version.outputs.version }}" ] || [ "$FORCE_BUILD" = "true" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Build needed: Version mismatch or force build"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "Build skipped: Versions match"
          fi

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            IVENTOY=${{ needs.check-version.outputs.iventoy_version }}
          labels: |
            IVENTOY=${{ needs.check-version.outputs.iventoy_version }}
          tags: |
            gremf/pxe:${{ needs.check-version.outputs.iventoy_version }}
            gremf/pxe:latest

  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [check-version, build-and-push]
    if: always() && needs.build-and-push.result == 'success'

    steps:
      - name: Send email notification
        uses: dawidd6/action-send-mail@v18 # updated to v18
        with:
          server_address: smtp.yandex.ru
          server_port: 465
          username: ${{ secrets.YANDEX_EMAIL_USERNAME }}
          password: ${{ secrets.YANDEX_EMAIL_PASSWORD }}
          subject: New PXE Docker Image Release
          body: |
            A new PXE Docker image has been released!

            Repository: https://hub.docker.com/r/gremf/pxe
            Version: ${{ needs.check-version.outputs.iventoy_version }}

            Pull commands:
              docker pull gremf/pxe:${{ needs.check-version.outputs.iventoy_version }}
              docker pull gremf/pxe:latest

            Build triggered by: ${{ github.event_name }}
            Commit: ${{ github.sha }}
          to: ${{ secrets.NOTIFICATION_EMAIL }} # required parameter
          from: ${{ secrets.YANDEX_EMAIL_USERNAME }}
          secure: true
