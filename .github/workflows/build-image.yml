name: Image Build

on:
  workflow_dispatch:
    inputs:
      force_build:
        required: false
        default: "false"
        type: string
  schedule:
    - cron: "0 4 * * 1"

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      iventoy: ${{ steps.iventoy.outputs.version }}
      buildOrNot: ${{ steps.buildOrNot.outputs.buildOrNot }}
    steps:
      - name: Get latest iVentoy version
        id: iventoy
        run: |
          version=$(curl -s https://api.github.com/repos/ventoy/PXE/releases/latest | grep "tag_name" | cut -d'"' -f4)
          echo "version=${version#'v'}" >> $GITHUB_OUTPUT

      - name: Check if new build is needed
        id: buildOrNot
        env:
          FORCE_BUILD: ${{ github.event.inputs.force_build }}
        run: |
          repo=${{ github.repository }}
          tag=latest
          token=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repo}:pull" | jq -r '.token')
          digest=$(curl -H "Accept: application/vnd.docker.distribution.manifest.v2+json" -H "Authorization: Bearer $token" -s "https://registry-1.docker.io/v2/${repo}/manifests/${tag}" | jq -r .config.digest)
          latest=$(curl -H "Accept: application/vnd.docker.distribution.manifest.v2+json" -H "Authorization: Bearer $token" -s -L "https://registry-1.docker.io/v2/${repo}/blobs/${digest}" | jq . | grep -Ew "IVENTOY" | cut -d'"' -f4)
          echo "buildOrNot=$([ "$latest" != "${{ steps.iventoy.outputs.version }}" ] && echo "true" || echo "${FORCE_BUILD:-false}")" >> $GITHUB_OUTPUT

      - name: Print outputs
        run: |
          echo "iVentoy version: ${{ steps.iventoy.outputs.version }}"
          echo "Build needed: ${{ steps.buildOrNot.outputs.buildOrNot }}"

  docker:
    name: Build PXE Docker Image
    runs-on: ubuntu-latest
    needs:
      - init
    if: needs.init.outputs.buildOrNot == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          provenance: false
          context: .
          file: ./Dockerfile
          labels: |
            IVENTOY=${{ needs.init.outputs.iventoy }}
          build-args: |
            IVENTOY=${{ needs.init.outputs.iventoy }}
          push: true
          tags: |
            gremf/pxe:${{ needs.init.outputs.iventoy }}
            gremf/pxe:latest

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.yandex.ru
          server_port: 465
          username: ${{ secrets.YANDEX_EMAIL_USERNAME }}
          password: ${{ secrets.YANDEX_EMAIL_PASSWORD }}
          subject: New PXE Docker Image Release
          body: |
            A new PXE Docker image has been released!
            Repository: https://hub.docker.com/r/gremf/pxe
            Version: ${{ needs.init.outputs.iventoy }}
            Pull command: docker pull gremf/pxe:${{ needs.init.outputs.iventoy }}
          to: ${{ secrets.NOTIFICATION_EMAIL }} # Обязательный параметр
          from: ${{ secrets.YANDEX_EMAIL_USERNAME }}
          secure: true
